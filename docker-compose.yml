version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automl_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/automl_assistant.db
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - backend_data:/app/uploads
      - backend_processed:/app/processed
      - backend_models:/app/trained_models
      - backend_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automl_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  backend_processed:
  backend_models:
  backend_db:
